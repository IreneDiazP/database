<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            font-size: 12px; /* Tamaño de fuente base */
        }
        .header {
            width: 100%;
            background-color: #dc3545;
            color: white;
            padding: 10px;
        }
        .header table {
            width: 100%;
            border-collapse: collapse;
        }
        .header img {
            width: 100px;
            height: 100px;
        }
        .header h1, .header h3, .header p {
            margin: 0;
        }
        .header .title {
            text-align: center;
        }
        .header .dates {
            text-align: right;
        }
        .header .dates p {
            margin: 2px 0;
        }
        .header .area {
            margin-top: 10px;
        }
        .container-table{
          width: 100%;
          padding: 10px;
        }
        .tabla-capacitacion{
          width: 100%;
          
        }
    </style>
</head>
<body>
    <div class="header">
        <table>
            <tr>
                <td style="width: 100px;">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcizVg6CO7Hd_xCwzi3buwc7qVN6MnPUciSw&s" alt="Logo">
                </td>
                <td class="title ">
                    <h1>CAPACITACION POR AREA - 2024</h1>
                    <h3>Oficina de Cooperacion Técnica y Asuntos Internacionales</h3>
                </td>
                <td class="dates" style="width: 150px;">
                    <p>Fecha: 24/04/2024</p>
                    <p>Hora: 11:58</p>
                    <p>Página: 1 - 13</p>
                </td>
            </tr>
        </table>
        <div class="area">
            <p>Área: <strong>AREA DE ALIMENTARIAS</strong></p>
        </div>


    </div>

    <div class="container-table">
      <table class="tabla-capacitacion">
        <thead>
          <tr>
            <th> Inicio</th>
            <th> Termino</th>
            <th> Evento</th>
            <th> PAis</th>
            <th> Fte.FFto</th>
            <th> Autorizacion</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th> 17-04-52</th>
            <th> 12-04-20</th>
            <th> EVENTO DE PRUEBASASAS</th>
            <th> Peru</th>
            <th> OIEA</th>
            <th> Carta oeiea me lasasasasa</th>
          </tr>
        </tbody>
      </table>
    </div>

</body>
</html>
